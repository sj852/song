<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>구간 연습 플레이어</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --text: #1d2330; --muted: #6b7280; --line: #e3e6eb;
    --accent: #3b6ef5; --accent-soft: rgba(59,110,245,.18); --wave: #b8c2d6; --played: #3b6ef5; --danger: #d9534f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171d; --panel: #1d2129; --text: #e6e8ec; --muted: #9aa3b2; --line: #2c323d;
      --accent: #6c93ff; --accent-soft: rgba(108,147,255,.22); --wave: #4a5366; --played: #6c93ff;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, "Malgun Gothic", sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 20px 16px 60px; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
  #drop { border: 2px dashed var(--line); border-radius: 12px; padding: 22px; text-align: center; color: var(--muted); cursor: pointer; }
  #drop.over { border-color: var(--accent); color: var(--accent); }
  #fileName { font-weight: 600; margin-bottom: 8px; word-break: break-all; }
  #waveWrap { position: relative; height: 140px; user-select: none; touch-action: none; cursor: crosshair; }
  canvas { width: 100%; height: 100%; display: block; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
  button { font: inherit; padding: 7px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--text); cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.on, button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  input[type=text], input[type=number] { font: inherit; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  input[type=number] { width: 80px; }
  .time { font-variant-numeric: tabular-nums; font-family: ui-monospace, Consolas, monospace; }
  #clock { font-size: 18px; min-width: 150px; }
  .muted { color: var(--muted); font-size: 13px; }
  table { width: 100%; border-collapse: collapse; }
  td, th { padding: 6px 4px; border-bottom: 1px solid var(--line); text-align: left; }
  th { font-weight: 600; color: var(--muted); font-size: 13px; }
  tr.active td { background: var(--accent-soft); }
  td input[type=text] { width: 100%; min-width: 80px; }
  .x { color: var(--danger); }
  kbd { font-family: ui-monospace, Consolas, monospace; font-size: 12px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; }
  .keys { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 4px 16px; }
  @media (max-width: 600px) { .hide-sm { display: none; } }
</style>
</head>
<body>
<main>
  <h1>🎵 구간 연습 플레이어</h1>

  <div class="panel">
    <div id="drop">여기에 음악 파일을 끌어다 놓거나 클릭해서 선택하세요 (m4a, mp3, wav 등)</div>
    <input type="file" id="fileInput" accept="audio/*,.m4a" hidden>
  </div>

  <div class="panel" id="player" hidden>
    <div id="fileName"></div>
    <div id="waveWrap"><canvas id="wave"></canvas></div>
    <div class="muted">파형을 클릭하면 이동, 드래그하면 구간 선택</div>

    <div class="row">
      <button id="playBtn" class="primary">▶ 재생</button>
      <span id="clock" class="time">0:00.0 / 0:00.0</span>
      <button id="loopBtn" class="on">🔁 구간 반복 켜짐</button>
    </div>

    <div class="row">
      <span>구간</span>
      <button id="setA">A 지정</button>
      <input type="text" id="aInput" class="time" size="8" title="시작 (분:초)">
      <span>~</span>
      <input type="text" id="bInput" class="time" size="8" title="끝 (분:초)">
      <button id="setB">B 지정</button>
      <button id="clearAB">구간 해제</button>
    </div>

    <div class="row">
      <label>속도 <input type="range" id="rate" min="0.5" max="1.5" step="0.05" value="1"></label>
      <span id="rateLabel" class="time">1.00x</span>
      <button data-rate="0.75">0.75x</button>
      <button data-rate="1">1x</button>
      <label class="muted">&nbsp;구간 앞 여유 <input type="number" id="preroll" min="0" max="10" step="0.5" value="0">초</label>
      <label class="muted">반복 사이 쉼 <input type="number" id="gap" min="0" max="10" step="0.5" value="0">초</label>
    </div>
  </div>

  <div class="panel" id="sectionsPanel" hidden>
    <div class="row" style="margin-top:0">
      <input type="text" id="secName" placeholder="구간 이름 (예: 1절, 후렴)">
      <button id="saveSec" class="primary">현재 구간 저장</button>
      <span style="flex:1"></span>
      <button id="exportBtn">내보내기</button>
      <button id="importBtn">불러오기</button>
      <input type="file" id="importInput" accept=".json" hidden>
    </div>
    <table style="margin-top:10px">
      <thead><tr><th>#</th><th>이름</th><th>시작</th><th>끝</th><th class="hide-sm">길이</th><th></th></tr></thead>
      <tbody id="secBody"></tbody>
    </table>
    <div id="noSec" class="muted" style="margin-top:8px">저장된 구간이 없습니다. 구간을 고른 뒤 이름을 적고 저장하세요. (브라우저에 자동 보관됨)</div>
  </div>

  <div class="panel muted">
    <div class="keys">
      <div><kbd>Space</kbd> 재생 / 일시정지</div>
      <div><kbd>A</kbd> / <kbd>B</kbd> 현재 위치를 시작 / 끝으로</div>
      <div><kbd>L</kbd> 구간 반복 켜기/끄기</div>
      <div><kbd>Enter</kbd> 구간 처음부터 다시</div>
      <div><kbd>←</kbd> <kbd>→</kbd> 5초 이동</div>
      <div><kbd>,</kbd> <kbd>.</kbd> 1초 이동</div>
      <div><kbd>-</kbd> <kbd>=</kbd> 속도 내리기 / 올리기</div>
      <div><kbd>1</kbd>~<kbd>9</kbd> 저장된 구간 선택</div>
    </div>
  </div>
</main>

<audio id="audio" preload="auto"></audio>

<script>
const $ = s => document.querySelector(s);
const audio = $('#audio');
const canvas = $('#wave');
const ctx2d = canvas.getContext('2d');

let fileKey = null;      // 저장 키 (파일 이름 + 크기)
let peaks = null;        // 파형 데이터
let A = null, B = null;  // 구간
let loop = true;
let sections = [];
let activeIdx = -1;
let waiting = false;     // 반복 사이 쉬는 중

// ---------- 시간 표시 ----------
function fmt(t) {
  if (t == null || isNaN(t)) return '';
  const m = Math.floor(t / 60), s = t - m * 60;
  return m + ':' + (s < 10 ? '0' : '') + s.toFixed(1);
}
function parseTime(str) {
  str = str.trim();
  if (!str) return null;
  const parts = str.split(':').map(Number);
  if (parts.some(isNaN)) return null;
  return parts.length === 2 ? parts[0] * 60 + parts[1] : parts[0];
}

// ---------- 파일 불러오기 ----------
const drop = $('#drop'), fileInput = $('#fileInput');
drop.onclick = () => fileInput.click();
fileInput.onchange = () => fileInput.files[0] && loadFile(fileInput.files[0]);
['dragover', 'dragenter'].forEach(e => document.addEventListener(e, ev => { ev.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(e => document.addEventListener(e, ev => { ev.preventDefault(); drop.classList.remove('over'); }));
document.addEventListener('drop', ev => { const f = ev.dataTransfer.files[0]; if (f) loadFile(f); });

async function loadFile(file) {
  fileKey = 'sections:' + file.name + ':' + file.size;
  $('#fileName').textContent = file.name;
  drop.textContent = '다른 파일을 열려면 끌어다 놓거나 클릭하세요';
  if (audio.src) URL.revokeObjectURL(audio.src);
  audio.src = URL.createObjectURL(file);
  $('#player').hidden = false;
  $('#sectionsPanel').hidden = false;
  A = B = null; activeIdx = -1; peaks = null;
  loadSections();
  syncInputs();
  draw();
  try {
    const buf = await file.arrayBuffer();
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    const decoded = await ac.decodeAudioData(buf);
    peaks = computePeaks(decoded, 2000);
    ac.close();
  } catch (e) { console.warn('파형 생성 실패', e); }
  draw();
}

function computePeaks(buffer, n) {
  const ch = buffer.numberOfChannels, len = buffer.length, size = Math.floor(len / n) || 1;
  const data = []; for (let c = 0; c < ch; c++) data.push(buffer.getChannelData(c));
  const out = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    let max = 0; const start = i * size, end = Math.min(start + size, len);
    for (let j = start; j < end; j += 4)
      for (let c = 0; c < ch; c++) { const v = Math.abs(data[c][j]); if (v > max) max = v; }
    out[i] = max;
  }
  const top = Math.max(...out) || 1;
  return out.map(v => v / top);
}

// ---------- 파형 그리기 ----------
function css(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function draw() {
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width !== w * dpr || canvas.height !== h * dpr) { canvas.width = w * dpr; canvas.height = h * dpr; }
  ctx2d.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx2d.clearRect(0, 0, w, h);
  const dur = audio.duration || 0;
  const x = t => dur ? t / dur * w : 0;

  // 선택 구간
  if (A != null && B != null) {
    ctx2d.fillStyle = css('--accent-soft');
    ctx2d.fillRect(x(A), 0, x(B) - x(A), h);
  }
  // 저장된 구간 표시 (위쪽 띠)
  sections.forEach((s, i) => {
    ctx2d.fillStyle = i === activeIdx ? css('--accent') : css('--wave');
    ctx2d.fillRect(x(s.start), 0, Math.max(2, x(s.end) - x(s.start)), 4);
  });

  // 파형
  const mid = h / 2 + 2, cur = x(audio.currentTime || 0);
  if (peaks) {
    const bar = 2, step = 3, n = Math.floor(w / step);
    for (let i = 0; i < n; i++) {
      const p = peaks[Math.floor(i / n * peaks.length)];
      const bh = Math.max(1, p * (h / 2 - 8));
      ctx2d.fillStyle = i * step < cur ? css('--played') : css('--wave');
      ctx2d.fillRect(i * step, mid - bh, bar, bh * 2);
    }
  } else {
    ctx2d.fillStyle = css('--wave');
    ctx2d.fillRect(0, mid - 1, w, 2);
    ctx2d.fillStyle = css('--played');
    ctx2d.fillRect(0, mid - 1, cur, 2);
    ctx2d.fillStyle = css('--muted') || '#888';
    ctx2d.font = '13px sans-serif';
    ctx2d.fillText(dur ? '파형 분석 중…' : '', 8, 20);
  }
  // A/B 선
  ctx2d.lineWidth = 2;
  [[A, 'A'], [B, 'B']].forEach(([t, label]) => {
    if (t == null) return;
    ctx2d.strokeStyle = css('--accent'); ctx2d.fillStyle = css('--accent');
    ctx2d.beginPath(); ctx2d.moveTo(x(t), 0); ctx2d.lineTo(x(t), h); ctx2d.stroke();
    ctx2d.font = 'bold 12px sans-serif';
    ctx2d.fillText(label, x(t) + 3, h - 6);
  });
  // 재생 위치
  ctx2d.fillStyle = css('--text');
  ctx2d.fillRect(cur - 1, 0, 2, h);
}
window.addEventListener('resize', draw);

// ---------- 파형 마우스 조작 ----------
let dragStart = null, dragged = false;
const waveWrap = $('#waveWrap');
function timeAt(ev) {
  const r = waveWrap.getBoundingClientRect();
  return Math.min(Math.max((ev.clientX - r.left) / r.width, 0), 1) * (audio.duration || 0);
}
waveWrap.addEventListener('pointerdown', ev => {
  if (!audio.duration) return;
  waveWrap.setPointerCapture(ev.pointerId);
  dragStart = timeAt(ev); dragged = false;
});
waveWrap.addEventListener('pointermove', ev => {
  if (dragStart == null) return;
  const t = timeAt(ev);
  if (Math.abs(t - dragStart) > audio.duration * 0.003) dragged = true;
  if (dragged) { A = Math.min(dragStart, t); B = Math.max(dragStart, t); activeIdx = -1; syncInputs(); draw(); }
});
waveWrap.addEventListener('pointerup', ev => {
  if (dragStart == null) return;
  if (dragged) seek(A); else seek(timeAt(ev));
  dragStart = null;
});

// ---------- 재생 제어 ----------
function seek(t) { audio.currentTime = Math.min(Math.max(t, 0), audio.duration || 0); draw(); }
function togglePlay() { if (!audio.src) return; audio.paused ? audio.play() : audio.pause(); }
function restartSection() {
  waiting = false;
  if (A != null) seek(Math.max(0, A - +$('#preroll').value));
  audio.play();
}
audio.onplay = audio.onpause = () => { $('#playBtn').textContent = audio.paused ? '▶ 재생' : '⏸ 일시정지'; };
$('#playBtn').onclick = togglePlay;

function setLoop(v) {
  loop = v;
  $('#loopBtn').classList.toggle('on', loop);
  $('#loopBtn').textContent = loop ? '🔁 구간 반복 켜짐' : '🔁 구간 반복 꺼짐';
}
$('#loopBtn').onclick = () => setLoop(!loop);

function setA(t) { A = t; if (B != null && B <= A) B = null; activeIdx = -1; syncInputs(); draw(); }
function setB(t) { B = t; if (A != null && A >= B) A = 0; if (A == null) A = 0; activeIdx = -1; syncInputs(); draw(); }
$('#setA').onclick = () => setA(audio.currentTime);
$('#setB').onclick = () => setB(audio.currentTime);
$('#clearAB').onclick = () => { A = B = null; activeIdx = -1; syncInputs(); draw(); renderSections(); };

function syncInputs() { $('#aInput').value = fmt(A); $('#bInput').value = fmt(B); renderSections(); }
$('#aInput').onchange = () => { const t = parseTime($('#aInput').value); A = t; activeIdx = -1; syncInputs(); draw(); };
$('#bInput').onchange = () => { const t = parseTime($('#bInput').value); B = t; activeIdx = -1; syncInputs(); draw(); };

// 속도
function setRate(r) {
  r = Math.min(Math.max(+r, 0.5), 1.5);
  audio.playbackRate = r; audio.preservesPitch = true;
  $('#rate').value = r; $('#rateLabel').textContent = r.toFixed(2) + 'x';
}
$('#rate').oninput = () => setRate($('#rate').value);
document.querySelectorAll('[data-rate]').forEach(b => b.onclick = () => setRate(b.dataset.rate));

// 반복 감시 (requestAnimationFrame 으로 정확하게)
function tick() {
  if (audio.src) {
    $('#clock').textContent = fmt(audio.currentTime) + ' / ' + fmt(audio.duration || 0);
    if (loop && !audio.paused && !waiting && A != null && B != null && audio.currentTime >= B) {
      const gap = +$('#gap').value;
      if (gap > 0) {
        waiting = true; audio.pause();
        setTimeout(() => { if (waiting) restartSection(); }, gap * 1000);
      } else {
        seek(Math.max(0, A - +$('#preroll').value));
      }
    }
    draw();
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
audio.addEventListener('play', () => { waiting = false; });

// ---------- 저장된 구간 ----------
function loadSections() {
  try { sections = JSON.parse(localStorage.getItem(fileKey)) || []; } catch { sections = []; }
  renderSections();
}
function saveSections() {
  try { localStorage.setItem(fileKey, JSON.stringify(sections)); } catch {}
  renderSections(); draw();
}
function renderSections() {
  const body = $('#secBody'); body.innerHTML = '';
  $('#noSec').hidden = sections.length > 0;
  sections.forEach((s, i) => {
    const tr = document.createElement('tr');
    if (i === activeIdx) tr.className = 'active';
    tr.innerHTML = `<td>${i + 1}</td><td><input type="text"></td>
      <td class="time">${fmt(s.start)}</td><td class="time">${fmt(s.end)}</td>
      <td class="time hide-sm">${(s.end - s.start).toFixed(1)}초</td>
      <td style="white-space:nowrap"><button class="play">▶</button> <button class="upd" title="현재 A~B로 덮어쓰기">⟳</button> <button class="x" title="삭제">✕</button></td>`;
    const name = tr.querySelector('input');
    name.value = s.name;
    name.onchange = () => { s.name = name.value; saveSections(); };
    tr.querySelector('.play').onclick = () => selectSection(i, true);
    tr.querySelector('.upd').onclick = () => {
      if (A == null || B == null) return alert('먼저 A~B 구간을 지정하세요.');
      s.start = A; s.end = B; activeIdx = i; saveSections();
    };
    tr.querySelector('.x').onclick = () => {
      if (!confirm(`"${s.name}" 구간을 삭제할까요?`)) return;
      sections.splice(i, 1); if (activeIdx === i) activeIdx = -1; else if (activeIdx > i) activeIdx--;
      saveSections();
    };
    body.appendChild(tr);
  });
}
function selectSection(i, play) {
  const s = sections[i]; if (!s) return;
  A = s.start; B = s.end; activeIdx = i;
  $('#aInput').value = fmt(A); $('#bInput').value = fmt(B);
  renderSections();
  if (play) restartSection(); else { seek(A); }
}
$('#saveSec').onclick = () => {
  if (A == null || B == null) return alert('먼저 A~B 구간을 지정하세요.');
  const name = $('#secName').value.trim() || ('구간 ' + (sections.length + 1));
  sections.push({ name, start: A, end: B });
  sections.sort((a, b) => a.start - b.start);
  activeIdx = sections.findIndex(s => s.start === A && s.end === B && s.name === name);
  $('#secName').value = '';
  saveSections();
};
$('#secName').addEventListener('keydown', e => { if (e.key === 'Enter') $('#saveSec').click(); });

// 내보내기 / 불러오기
$('#exportBtn').onclick = () => {
  const blob = new Blob([JSON.stringify(sections, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = ($('#fileName').textContent.replace(/\.[^.]+$/, '') || 'sections') + '_구간.json';
  a.click();
};
$('#importBtn').onclick = () => $('#importInput').click();
$('#importInput').onchange = async () => {
  const f = $('#importInput').files[0]; if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (!Array.isArray(data)) throw 0;
    sections = data.filter(s => typeof s.start === 'number' && typeof s.end === 'number');
    activeIdx = -1; saveSections();
  } catch { alert('구간 파일을 읽을 수 없습니다.'); }
  $('#importInput').value = '';
};

// ---------- 단축키 ----------
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' && e.target.type !== 'range') return;
  if (!audio.src) return;
  const k = e.key;
  if (k === ' ') { e.preventDefault(); togglePlay(); }
  else if (k === 'a' || k === 'A') setA(audio.currentTime);
  else if (k === 'b' || k === 'B') setB(audio.currentTime);
  else if (k === 'l' || k === 'L') setLoop(!loop);
  else if (k === 'Enter') restartSection();
  else if (k === 'ArrowLeft') { e.preventDefault(); seek(audio.currentTime - 5); }
  else if (k === 'ArrowRight') { e.preventDefault(); seek(audio.currentTime + 5); }
  else if (k === ',') seek(audio.currentTime - 1);
  else if (k === '.') seek(audio.currentTime + 1);
  else if (k === '-') setRate(audio.playbackRate - 0.05);
  else if (k === '=' || k === '+') setRate(audio.playbackRate + 0.05);
  else if (/^[1-9]$/.test(k)) selectSection(+k - 1, true);
});
</script>
</body>
</html>
