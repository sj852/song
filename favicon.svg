<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 성탄의 별: 페이지 머리 띠와 같은 밤하늘(남색 → 붉은 빛)에 금빛 별 -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#131a33"/>
      <stop offset="1" stop-color="#232b52"/>
    </linearGradient>
    <radialGradient id="warm" cx="1" cy="0" r="1.1">
      <stop offset="0" stop-color="#962837" stop-opacity=".8"/>
      <stop offset=".6" stop-color="#962837" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#f5c95c" stop-opacity=".6"/>
      <stop offset="1" stop-color="#f5c95c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe39a"/>
      <stop offset="1" stop-color="#e3a531"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#sky)"/>
  <rect width="64" height="64" rx="14" fill="url(#warm)"/>
  <circle cx="32" cy="33" r="25" fill="url(#glow)"/>
  <path d="M32 11.5l5.6 12.4 13.5 1.4-10.1 9.1 2.9 13.3L32 40.9l-11.8 6.8 2.9-13.3-10.1-9.1 13.5-1.4z"
        fill="url(#gold)" stroke="#fff4d0" stroke-width="1.2" stroke-linejoin="round"/>
  <circle cx="12" cy="13" r="1.3" fill="#fff" opacity=".85"/>
  <circle cx="52" cy="51" r="1.1" fill="#fff" opacity=".6"/>
  <circle cx="10" cy="48" r="0.9" fill="#fff" opacity=".55"/>
  <path d="M51 10.5q0 3.5 3.5 3.5-3.5 0-3.5 3.5 0-3.5-3.5-3.5 3.5 0 3.5-3.5z" fill="#fff6c8"/>
</svg>
